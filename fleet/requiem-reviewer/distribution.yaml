name: requiem-reviewer
version: 0.1.0
description: >-
  Requiem review worker. Reviews a delivered leaf's pull request against the
  repo's house-style and the leaf's spec, then emits the requiem handoff receipt
  (ADR-0017 §4) recording the review outcome.
hermes_requires: ">=0.15.0"
author: "Requiem"
license: "MIT"

# Twig and gh authenticate against AAD via interactive PKCE / device-code flows
# the FIRST time you run them on the host (`twig auth login`, `gh auth login`).
# The container does NOT mint tokens itself (no `ADO_PAT` env var — PATs are
# not supported in Daniel's primary ADO org per ADR-0007 Q4); the host's token
# stores are mounted into the container instead.
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Model provider key (matches config.yaml model.default)"
    required: false
    default: ""

distribution_owned:
  - SOUL.md
  - skills/handoff-receipt/
