name: requiem-closer
version: 0.1.0
description: >-
  Requiem close-out worker. Drives a delivered leaf's pull request through its
  ADO lifecycle (resolve, link, complete) and emits the requiem handoff receipt
  (ADR-0017 §4) recording the close-out outcome.
hermes_requires: ">=0.15.0"
author: "Requiem"
license: "MIT"

env_requires:
  - name: ADO_PAT
    description: "Azure DevOps PAT the worker uses to complete PRs / work items"
    required: true
  - name: ANTHROPIC_API_KEY
    description: "Model provider key (matches config.yaml model.default)"
    required: false
    default: ""

distribution_owned:
  - SOUL.md
  - skills/handoff-receipt/
