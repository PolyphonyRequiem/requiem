name: requiem-implementer
version: 0.1.0
description: >-
  Requiem delivery worker. Implements one decomposed leaf of an ADO work-item
  tree on an isolated worktree and emits the requiem handoff receipt
  (ADR-0017 §4) on completion so the orchestrator can verify, not trust, the
  delivery.
hermes_requires: ">=0.15.0"
author: "Requiem"
license: "MIT"

# The worker model is a profile property, NOT a per-task flag — requiem never
# passes `--model` at `hermes kanban create` time (it does not exist). The
# operator pins the model with `hermes -p requiem-implementer model` or by
# editing config.yaml below before install.
# Twig and gh authenticate against AAD via interactive PKCE / device-code flows
# the FIRST time you run them on the host (`twig auth login`, `gh auth login`).
# Those flows mint refresh tokens stored at ~/.twig/.refresh-token and
# ~/.config/gh/hosts.yml respectively. The container does NOT mint tokens
# itself (no `ADO_PAT` env var — PATs are not supported in Daniel's primary
# ADO org per ADR-0007 Q4). Instead, the host's token stores are MOUNTED
# READ-ONLY into the container so the worker can refresh them as needed.
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Model provider key (matches config.yaml model.default)"
    required: false
    default: ""

# On `hermes profile update`, replace the requiem-owned house-style verbatim
# (SOUL + the receipt skill ARE the wire contract) but PRESERVE the operator's
# config.yaml (model/provider/credentials) — config.yaml is intentionally
# omitted here so a re-install never clobbers a tuned model choice.
distribution_owned:
  - SOUL.md
  - skills/handoff-receipt/
